<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XFORCE CLUB | نادي رياضي في معرة النعمان</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
.hero{min-height:95vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:30px 18px 35px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,0.1),rgba(0,0,0,0.95)),url('hero.jpg');background-size:cover;background-position:center;background-color:#111}
.badge{background:#FF6B00;color:#fff;padding:7px 16px;border-radius:50px;font-weight:bold;font-size:13px;margin-bottom:15px}
.logo-box{background:#fff;padding:14px 22px;border-radius:20px;line-height:1;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo-box .x{color:#FF6B00;font-size:58px;font-weight:900;letter-spacing:-2px}
.logo-box .force{color:#000;font-size:58px;font-weight:900;letter-spacing:-2px}
.logo-box small{color:#FF6B00;font-weight:bold;font-size:14px;letter-spacing:3px}
.hero p{margin:15px 0 5px;color:#eee;font-size:17px}
.hero small{color:#FF6B00;font-weight:bold}
.btn{display:block;width:100%;max-width:360px;padding:16px;margin:9px auto;border-radius:50px;text-decoration:none;font-weight:bold;font-size:18px;text-align:center}
.btn-orange{background:#FF6B00;color:#fff}
